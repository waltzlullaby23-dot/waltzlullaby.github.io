name: Validate maintenance dispatch app

on:
  push:
    paths:
      - "maintenance-dispatch/**"
      - ".github/workflows/validate-maintenance-dispatch.yml"
  pull_request:
    paths:
      - "maintenance-dispatch/**"
      - ".github/workflows/validate-maintenance-dispatch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("maintenance-dispatch/index.html").read_text(encoding="utf-8")
          start = html.find("<script>")
          end = html.find("</script>", start + 1)
          if start < 0 or end < 0:
              raise SystemExit("Inline script block not found")
          script = html[start + len("<script>"):end]
          Path("/tmp/maintenance-dispatch.js").write_text(script, encoding="utf-8")
          print(f"Extracted {len(script.splitlines())} JavaScript lines")
          PY
      - name: Validate JavaScript syntax
        run: node --check /tmp/maintenance-dispatch.js
      - name: Check required app sections
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("maintenance-dispatch/index.html").read_text(encoding="utf-8")
          required = [
              "勤務總覽", "人員名冊", "車型與截止設定",
              "localStorage", "lockSchedule", "schedulesCsv",
              "reopenForm", "vehicleForm"
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing required app content: " + ", ".join(missing))
          print("Required app content is present.")
          PY
