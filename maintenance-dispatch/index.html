<script>
(function(){
'use strict';
const STORE_KEY='taipower-maintenance-dispatch-v1';
const defaultSettings={bigBusThreshold:20,smallBusCapacity:19,bigBusCapacity:43,defaultCutoffDays:1,defaultCutoffTime:'16:00'};
function initialState(){return {settings:Object.assign({},defaultSettings),schedules:[],staff:[],snapshots:[],audit:[]};}
function loadState(){try{const raw=localStorage.getItem(STORE_KEY);if(!raw)return initialState();const x=JSON.parse(raw);return {settings:Object.assign({},defaultSettings,x.settings||{}),schedules:Array.isArray(x.schedules)?x.schedules:[],staff:Array.isArray(x.staff)?x.staff:[],snapshots:Array.isArray(x.snapshots)?x.snapshots:[],audit:Array.isArray(x.audit)?x.audit:[]};}catch(e){return initialState();}}
let state=loadState();
let view='dashboard',currentDate=todayString(),currentScheduleId=null,scheduleSearch='',staffSearch='',editScheduleId=null,editPersonId=null,editVehicleId=null,toastTimer=null;
const app=document.getElementById('app'),modalRoot=document.getElementById('modal-root');
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,9);}
function todayString(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function toLocalInput(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());}
function addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00');d.setDate(d.getDate()+Number(n));return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtDate(v){if(!v)return '—';const d=new Date(v.length===10?v+'T12:00:00':v);if(isNaN(d))return v;return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate());}
function fmtDateTime(v){if(!v)return '—';const d=new Date(v);if(isNaN(d))return v;return d.getFullYear()+'/'+pad(d.getMonth()+1)+'/'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function fmtTime(v){return v||'未設定';}
function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function persist(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));return true;}catch(e){showToast('瀏覽器儲存失敗，請檢查儲存空間或匯出備份。');return false;}}
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),3200);}
function audit(action,s,detail){state.audit.unshift({id:uid(),at:new Date().toISOString(),action:action,scheduleId:s?s.id:null,scheduleLabel:s?(s.destination+'／'+s.unit):'',detail:detail||''});if(state.audit.length>1200)state.audit=state.audit.slice(0,1200);}
function clone(x){return JSON.parse(JSON.stringify(x));}
function getSchedule(id){return state.schedules.find(s=>s.id===id);}
function mealLabel(v){return v==='yes'?'需要':v==='no'?'不需要':'未確認';}
function mealBadge(v){return v==='yes'?'badge-blue':v==='no'?'badge-gray':'badge-amber';}
function countMeals(s){return (s.people||[]).filter(p=>p.meal==='yes').length;}
function countUnconfirmedMeals(s){return (s.people||[]).filter(p=>!p.meal||p.meal==='unknown').length;}
function recommendation(n){const cfg=state.settings;if(!n)return {type:'尚無人員',count:0,capacity:0,label:'尚無人員'};const big=Number(cfg.bigBusThreshold)||20;const smallCap=Math.max(1,Number(cfg.smallBusCapacity)||19);const bigCap=Math.max(1,Number(cfg.bigBusCapacity)||43);if(n>=big){const count=Math.ceil(n/bigCap);return {type:'大巴',count:count,capacity:count*bigCap,label:'大巴 '+count+' 輛'};}const count=Math.ceil(n/smallCap);return {type:'小巴',count:count,capacity:count*smallCap,label:'小巴 '+count+' 輛'};}
function scheduleStatus(s){if(s.locked)return {text:'已截止鎖定',cls:'badge-gray'};const dl=new Date(s.deadlineAt).getTime();if(!s.deadlineAt||isNaN(dl))return {text:'未設定期限',cls:'badge-red'};const diff=dl-Date.now();if(diff<=0)return {text:'等待鎖定',cls:'badge-red'};if(diff<24*60*60*1000)return {text:'即將截止',cls:'badge-amber'};return {text:'統計中',cls:'badge-green'};}
function checkDeadlines(){let changed=false;const now=Date.now();state.schedules.forEach(s=>{if(!s.locked&&s.deadlineAt&&new Date(s.deadlineAt).getTime()<=now){lockSchedule(s,'已到截止時間，系統偵測後自動鎖定',true);changed=true;}});if(changed)persist();return changed;}
function lockSchedule(s,reason,silent){s.locked=true;s.lockedAt=new Date().toISOString();s.lockReason=reason||'依截止時間鎖定';const rec=recommendation((s.people||[]).length);const snap={id:uid(),scheduleId:s.id,destination:s.destination,unit:s.unit,date:s.date,deadlineAt:s.deadlineAt,lockedAt:s.lockedAt,reason:s.lockReason,people:clone(s.people||[]),vehicles:clone(s.vehicles||[]),personCount:(s.people||[]).length,mealCount:countMeals(s),unconfirmedMealCount:countUnconfirmedMeals(s),recommendation:rec.label};state.snapshots.unshift(snap);audit('名單鎖定',s,reason||'依截止時間鎖定');if(!silent)showToast('勤務名單已鎖定，已保存截止版本。');}
function getDefaultDate(){const now=new Date();let offset=Math.max(0,Number(state.settings.defaultCutoffDays)||0);const h=Number(state.settings.defaultCutoffTime.split(':')[0]||16),m=Number(state.settings.defaultCutoffTime.split(':')[1]||0);const cutoffToday=new Date();cutoffToday.setHours(h,m,0,0);if(now.getTime()>=cutoffToday.getTime())offset+=1;return addDays(todayString(),offset);}
function getDefaultDeadline(dateStr){const dueDate=addDays(dateStr,-Math.max(0,Number(state.settings.defaultCutoffDays)||0));return dueDate+'T'+(state.settings.defaultCutoffTime||'16:00');}

const demoStaff=[{name:'王建宏',department:'維修甲班',gender:'男',meal:'yes',phone:''},{name:'林怡君',department:'維修甲班',gender:'女',meal:'yes',phone:''},{name:'陳志明',department:'維修乙班',gender:'男',meal:'no',phone:''},{name:'張雅婷',department:'維修乙班',gender:'女',meal:'unknown',phone:''},{name:'李承翰',department:'電氣維護組',gender:'男',meal:'yes',phone:''}];
demoStaff.forEach(p=>addPersonToDirectory(Object.assign({id:uid()},p)));
const s1={id:uid(),date:currentDate,destination:'示範電廠 A（虛構）',unit:'維修甲班',meetingTime:'07:30',deadlineAt:toLocalInput(new Date(Date.now()+3*60*60*1000)),notes:'此為展示用虛構資料，請勿視為實際勤務。',people:demoStaff.slice(0,3).map(p=>Object.assign({id:uid()},p)),vehicles:[{id:uid(),type:'小巴',plate:'TEST-001',capacity:19,note:'虛構車牌'}],locked:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
const s2={id:uid(),date:currentDate,destination:'示範變電所 B（虛構）',unit:'電氣維護組',meetingTime:'08:00',deadlineAt:toLocalInput(new Date(Date.now()+5*60*60*1000)),notes:'此為展示用虛構資料，請勿視為實際勤務。',people:demoStaff.concat(demoStaff.slice(0,1)).map(p=>Object.assign({id:uid()},p)),vehicles:[],locked:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
state.schedules.push(s1,s2);audit('載入示範資料',null,'已新增虛構測試勤務及人員');persist();view='dashboard';render();showToast('已載入示範資料。正式使用前可刪除這些虛構紀錄。');}
function download(name,content,type){const blob=new Blob([content],{type:type||'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function csvCell(v){const s=String(v==null?'':v);return '"'+s.replace(/"/g,'""')+'"';}
function schedulesCsv(schedules){const headers=['出勤日期','維護地點','維護單位','集合時間','截止時間','名單狀態','姓名','部門','性別','是否需供餐','聯絡電話','系統建議車型','實際車型','車牌號碼','車輛容量','備註'];const rows=[headers];schedules.forEach(s=>{const rec=recommendation((s.people||[]).length);const vs=(s.vehicles||[]);const ps=(s.people||[]);if(!ps.length){rows.push([s.date,s.destination,s.unit,s.meetingTime,fmtDateTime(s.deadlineAt),s.locked?'已鎖定':'統計中','','','','','','',vs.map(v=>v.type).join('、'),vs.map(v=>v.plate||'車牌待補').join('、'),vs.reduce((a,v)=>a+(Number(v.capacity)||0),0),s.notes||'']);}else ps.forEach(p=>rows.push([s.date,s.destination,s.unit,s.meetingTime,fmtDateTime(s.deadlineAt),s.locked?'已鎖定':'統計中',p.name,p.department,p.gender||'',mealLabel(p.meal),p.phone||'',rec.label,vs.map(v=>v.type).join('、'),vs.map(v=>v.plate||'車牌待補').join('、'),vs.reduce((a,v)=>a+(Number(v.capacity)||0),0),s.notes||'']));});return '\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\\r\\n');}
function exportSchedulesCsv(schedules,name){download(name,schedulesCsv(schedules),'text/csv;charset=utf-8');showToast('CSV 已匯出。請妥善保管包含個資的檔案。');}
function exportStaffCsv(){const rows=[['姓名','部門','性別','供餐預設','聯絡電話']].concat(state.staff.map(p=>[p.name,p.department,p.gender||'',mealLabel(p.meal),p.phone||'']));download('維護勤務_常用人員.csv','\\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\\r\\n'),'text/csv;charset=utf-8');showToast('人員 CSV 已匯出。');}
function exportBackup(){download('維護勤務系統備份_'+todayString()+'.json',JSON.stringify({app:'Taipower Maintenance Dispatch',version:1,exportedAt:new Date().toISOString(),...state},null,2),'application/json;charset=utf-8');showToast('備份已匯出，請妥善保管含個資的備份檔。');}
function importBackupFile(file){if(!file)return;const reader=new FileReader();reader.onload=function(){try{const x=JSON.parse(reader.result);if(!Array.isArray(x.schedules)||!Array.isArray(x.staff)||!x.settings)throw new Error('格式不符');if(!confirm('匯入將以備份檔內容取代目前瀏覽器的所有系統資料。請先確認已另存目前資料的備份。確定還原？'))return;state={settings:Object.assign({},defaultSettings,x.settings),schedules:x.schedules,staff:x.staff,snapshots:Array.isArray(x.snapshots)?x.snapshots:[],audit:Array.isArray(x.audit)?x.audit:[]};audit('還原備份',null,'匯入 JSON 備份檔');persist();view='dashboard';render();showToast('備份還原完成。');}catch(e){alert('匯入失敗：檔案格式不正確，或缺少必要資料欄位。');}};reader.readAsText(file);}
function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;
switch(a){
case 'navigate': view=b.dataset.view||'dashboard';if(view==='detail'&&!getSchedule(currentScheduleId))view='schedules';document.getElementById('sidebar').classList.remove('open');render();break;
case 'toggle-menu':document.getElementById('sidebar').classList.toggle('open');break;
case 'new-schedule':openScheduleForm(null);break;
case 'edit-schedule':openScheduleForm(id);break;
case 'open-schedule':currentScheduleId=id;view='detail';render();break;
case 'close-modal':closeModal();break;
case 'new-staff':openStaffForm(null);break;
case 'edit-staff':openStaffForm(id);break;
case 'add-person':currentScheduleId=id||currentScheduleId;openSchedulePersonForm(null);break;
case 'edit-person':openSchedulePersonForm(id);break;
case 'add-vehicle':currentScheduleId=id||currentScheduleId;openVehicleForm(null);break;
case 'edit-vehicle':openVehicleForm(id);break;
case 'clear-schedule-search':scheduleSearch='';renderSchedules();break;
case 'clear-staff-search':staffSearch='';renderStaff();break;
case 'export-all':exportSchedulesCsv(state.schedules,'維護勤務_全部行程.csv');break;
case 'export-day':exportSchedulesCsv(state.schedules.filter(s=>s.date===currentDate),'維護勤務_'+currentDate+'.csv');break;
case 'export-schedule':{const s=getSchedule(id||currentScheduleId);if(s)exportSchedulesCsv([s],'維護勤務_'+s.date+'_'+s.destination.replace(/[\\:*?"<>|]/g,'_').replaceAll('/','_')+'.csv');break;}
case 'export-staff':exportStaffCsv();break;
case 'export-backup':exportBackup();break;
case 'import-backup':document.getElementById('backupImportFile').click();break;
case 'print':window.print();break;
case 'load-demo':loadDemoData();break;
case 'delete-schedule':{const s=getSchedule(id);if(s&&!s.locked&&confirm('確定刪除勤務「'+s.destination+'」？此操作無法直接復原，建議先匯出備份。')){state.schedules=state.schedules.filter(x=>x.id!==id);audit('刪除勤務',s,'刪除勤務主檔');persist();view='schedules';render();showToast('勤務已刪除。');}else if(s&&s.locked)showToast('已鎖定勤務不可直接刪除。');break;}
case 'delete-person':{const s=getSchedule(currentScheduleId);if(!s||s.locked){showToast('勤務已鎖定。');break;}const p=s.people.find(x=>x.id===id);if(p&&confirm('確定將 '+p.name+' 從本次勤務名單移除？')){s.people=s.people.filter(x=>x.id!==id);s.updatedAt=new Date().toISOString();audit('移除出勤人員',s,p.name+'／'+p.department);persist();render();showToast('已移除出勤人員。');}break;}
case 'delete-staff':{const p=state.staff.find(x=>x.id===id);if(p&&confirm('確定刪除常用人員「'+p.name+'」？已加入的勤務名單不會受到影響。')){state.staff=state.staff.filter(x=>x.id!==id);audit('刪除常用人員',null,p.name+'／'+p.department);persist();renderStaff();showToast('常用人員已刪除。');}break;}
case 'delete-vehicle':{const s=getSchedule(currentScheduleId);if(!s||s.locked){showToast('勤務已鎖定。');break;}if(confirm('確定移除此輛車？')){s.vehicles=s.vehicles.filter(x=>x.id!==id);s.updatedAt=new Date().toISOString();audit('移除派遣車輛',s,'移除車輛資料');persist();render();showToast('車輛已移除。');}break;}
case 'add-directory-person':{const s=getSchedule(id||currentScheduleId);if(!s||s.locked){showToast('勤務已鎖定。');break;}const sel=document.getElementById('addDirectoryPerson');const p=sel&&state.staff.find(x=>x.id===sel.value);if(!p){showToast('請先選擇一位常用人員。');break;}if(s.people.some(x=>x.name===p.name&&x.department===p.department)){showToast('此人員已在本次勤務名單中。');break;}s.people.push(Object.assign({},clone(p),{id:uid()}));s.updatedAt=new Date().toISOString();audit('加入出勤人員',s,p.name+'／'+p.department);persist();render();showToast('已加入 '+p.name+'，人數已更新。');break;}
case 'lock-now':{const s=getSchedule(id);if(!s||s.locked)break;if(confirm('確定立即截止並鎖定「'+s.destination+'」的名單？系統會保存當下版本。')){lockSchedule(s,'承辦人提前截止並鎖定',false);persist();render();}break;}
case 'reopen-schedule':openReopenForm(id);break;
case 'show-snapshot':showSnapshot(id);break;
case 'reset-settings':if(confirm('將系統門檻與新勤務預設截止規則恢復初始值？既有勤務截止時間不會變更。')){state.settings=Object.assign({},defaultSettings);audit('重設系統設定',null,'恢復初始設定');persist();renderSettings();showToast('設定已恢復初始值。');}break;
default:break;
}}
document.addEventListener('click',handleClick);
document.addEventListener('click',function(e){if(e.target&&e.target.id==='modalBackdrop')closeModal();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
document.addEventListener('change',function(e){if(e.target&&e.target.id==='dashboardDate'){currentDate=e.target.value||todayString();renderDashboard();}if(e.target&&e.target.id==='vehicleType'){const cap=document.getElementById('vehicleCapacity');if(cap){if(e.target.value==='大巴')cap.value=state.settings.bigBusCapacity;else if(e.target.value==='小巴')cap.value=state.settings.smallBusCapacity;}}});
document.addEventListener('submit',function(e){const f=e.target;if(!f.id)return;e.preventDefault();const fd=new FormData(f);
if(f.id==='scheduleSearchForm'){scheduleSearch=String(fd.get('q')||'');renderSchedules();return;}
if(f.id==='staffSearchForm'){staffSearch=String(fd.get('q')||'');renderStaff();return;}
if(f.id==='scheduleForm'){const date=String(fd.get('date')||''),dest=String(fd.get('destination')||'').trim(),unit=String(fd.get('unit')||'').trim(),deadline=String(fd.get('deadlineAt')||'');if(!date||!dest||!unit||!deadline){showToast('請填妥日期、維護地點、維護單位及截止時間。');return;}if(new Date(deadline).getTime()<=Date.now()&&!editScheduleId){if(!confirm('截止時間已過，建立後會立即鎖定。仍要建立嗎？'))return;}if(editScheduleId){const s=getSchedule(editScheduleId);if(!s||s.locked){showToast('勤務已鎖定，無法修改。');closeModal();return;}const old=s.destination+'／'+s.unit;s.date=date;s.destination=dest;s.unit=unit;s.meetingTime=String(fd.get('meetingTime')||'');s.deadlineAt=deadline;s.notes=String(fd.get('notes')||'').trim();s.updatedAt=new Date().toISOString();audit('修改勤務資料',s,'更新基本資料：'+old);persist();closeModal();currentScheduleId=s.id;view='detail';render();showToast('勤務資料已更新。');}else{const s={id:uid(),date:date,destination:dest,unit:unit,meetingTime:String(fd.get('meetingTime')||''),deadlineAt:deadline,notes:String(fd.get('notes')||'').trim(),people:[],vehicles:[],locked:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};state.schedules.push(s);audit('建立勤務',s,'新增勤務主檔');persist();currentScheduleId=s.id;view='detail';closeModal();render();showToast('勤務已建立，請繼續加入人員及登錄車輛。');}return;}
if(f.id==='schedulePersonForm'){const s=getSchedule(currentScheduleId);if(!s||s.locked){showToast('勤務已鎖定。');closeModal();return;}const p={name:String(fd.get('name')||'').trim(),department:String(fd.get('department')||'').trim(),gender:String(fd.get('gender')||''),meal:String(fd.get('meal')||'unknown'),phone:String(fd.get('phone')||'').trim()};if(!p.name||!p.department){showToast('姓名與部門為必填欄位。');return;}if(editPersonId){const old=s.people.find(x=>x.id===editPersonId);if(old){Object.assign(old,p);audit('修改出勤人員',s,p.name+'／'+p.department);}}else{s.people.push(Object.assign({id:uid()},p));audit('新增出勤人員',s,p.name+'／'+p.department);}if(fd.get('saveToDirectory'))addPersonToDirectory(p);s.updatedAt=new Date().toISOString();persist();closeModal();render();showToast('人員資料已儲存，人數已重新計算。');return;}
if(f.id==='staffForm'){const p={name:String(fd.get('name')||'').trim(),department:String(fd.get('department')||'').trim(),gender:String(fd.get('gender')||''),meal:String(fd.get('meal')||'unknown'),phone:String(fd.get('phone')||'').trim()};if(!p.name||!p.department){showToast('姓名與部門為必填欄位。');return;}if(editPersonId){const old=state.staff.find(x=>x.id===editPersonId);if(old){Object.assign(old,p,{updatedAt:new Date().toISOString()});audit('修改常用人員',null,p.name+'／'+p.department);}}else{if(state.staff.some(x=>x.name===p.name&&x.department===p.department)){showToast('名冊中已有相同姓名及部門的人員。');return;}state.staff.push(Object.assign({id:uid(),createdAt:new Date().toISOString()},p));audit('新增常用人員',null,p.name+'／'+p.department);}persist();closeModal();renderStaff();showToast('常用人員已儲存。');return;}
if(f.id==='vehicleForm'){const s=getSchedule(currentScheduleId);if(!s||s.locked){showToast('勤務已鎖定。');closeModal();return;}const v={type:String(fd.get('type')||'小巴'),capacity:Number(fd.get('capacity')||0),plate:String(fd.get('plate')||'').trim(),note:String(fd.get('note')||'').trim()};if(!v.capacity||v.capacity<1){showToast('請輸入有效的核定乘客數。');return;}if(editVehicleId){const old=s.vehicles.find(x=>x.id===editVehicleId);if(old)Object.assign(old,v);}else s.vehicles.push(Object.assign({id:uid()},v));s.updatedAt=new Date().toISOString();audit(editVehicleId?'修改派遣車輛':'新增派遣車輛',s,v.type+'／'+(v.plate||'車牌待補')+'／容量 '+v.capacity);persist();closeModal();render();showToast('車輛資料已儲存。');return;}
if(f.id==='settingsForm'){const next={bigBusThreshold:Number(fd.get('bigBusThreshold')),smallBusCapacity:Number(fd.get('smallBusCapacity')),bigBusCapacity:Number(fd.get('bigBusCapacity')),defaultCutoffDays:Number(fd.get('defaultCutoffDays')),defaultCutoffTime:String(fd.get('defaultCutoffTime')||'16:00')};if(!next.bigBusThreshold||!next.smallBusCapacity||!next.bigBusCapacity||next.defaultCutoffDays<0||!next.defaultCutoffTime){showToast('請確認設定值皆有效。');return;}state.settings=next;audit('修改系統設定',null,'修改車型門檻、容量或預設截止規則');persist();renderSettings();showToast('系統設定已儲存。新勤務將使用新的截止預設值。');return;}
if(f.id==='reopenForm'){const s=getSchedule(currentScheduleId);const reason=String(fd.get('reason')||'').trim(),deadline=String(fd.get('deadlineAt')||'');if(!s||!s.locked){closeModal();return;}if(!reason||!deadline||new Date(deadline).getTime()<=Date.now()){showToast('請輸入原因及未來的截止時間。');return;}s.locked=false;s.lockedAt=null;s.lockReason='';s.deadlineAt=deadline;s.updatedAt=new Date().toISOString();audit('重新開放勤務',s,'原因：'+reason+'；新截止：'+fmtDateTime(deadline));persist();closeModal();render();showToast('勤務已重新開放，新的截止時間已設定。');return;}
});
document.getElementById('backupImportFile').addEventListener('change',function(e){const file=e.target.files&&e.target.files[0];if(file)importBackupFile(file);e.target.value='';});
const initialCutoff=checkDeadlines();render();
setInterval(function(){if(checkDeadlines()){render();showToast('已自動鎖定到達截止時間的勤務。');}},60000);
})();
</script>
